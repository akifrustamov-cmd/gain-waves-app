<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111214" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GAIN WAVES</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro__glow"></div>
    <div class="intro__wave">🌊</div>
    <div class="intro__word">GAIN WAVES</div>
    <svg class="intro__line" viewBox="0 0 240 24" fill="none"><path d="M2 12 C 22 0, 38 0, 58 12 S 98 24, 118 12 S 158 0, 178 12 S 218 24, 238 12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
    <p class="intro__tag">No pain, no gain waves.</p>
  </div>
  <script>
    (function () {
      var el = document.getElementById('intro'), seen = false;
      try { seen = sessionStorage.getItem('gw-intro'); sessionStorage.setItem('gw-intro', '1'); } catch (e) {}
      if (seen) { el.remove(); return; }
      var w = el.querySelector('.intro__word'), t = w.textContent; w.textContent = '';
      t.split('').forEach(function (c, i) { var s = document.createElement('span'); s.textContent = c === ' ' ? '\u00a0' : c; s.style.setProperty('--i', i); w.appendChild(s); });
      var done = function () { if (!el.isConnected || el.classList.contains('is-out')) return; el.classList.add('is-out'); setTimeout(function () { el.remove(); }, 450); };
      el.addEventListener('click', done);
      setTimeout(done, matchMedia('(prefers-reduced-motion: reduce)').matches ? 1200 : 2700);
    })();
  </script>
  <header class="top">
    <div class="brand"><span class="brand__mark"></span>GAIN WAVES</div>
    <div class="top__xp" id="top-xp" hidden></div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabs" id="tabs" hidden>
    <a href="#home" data-tab="home"><span class="tabs__i">◆</span>Home</a>
    <a href="#log" data-tab="log"><span class="tabs__i">+</span>Log</a>
    <a href="#store" data-tab="store"><span class="tabs__i">▣</span>Store</a>
    <a href="#gym" data-tab="gym"><span class="tabs__i">▲</span>Gym</a>
    <a href="#rewards" data-tab="rewards"><span class="tabs__i">★</span>Rewards</a>
    <a href="#profile" data-tab="profile"><span class="tabs__i">●</span>Profile</a>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="zones.js"></script>
</body>
</html>
