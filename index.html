  <script>
    (function () {
      var el = document.getElementById('intro'), seen = false;
      try { seen = sessionStorage.getItem('gw-intro'); sessionStorage.setItem('gw-intro', '1'); } catch (e) {}
      if (seen) { el.remove(); return; }
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) el.querySelectorAll('.intro__sea animate').forEach(function (an) { var v = an.getAttribute('values').split(';'); an.parentNode.setAttribute('d', v[v.length - 1]); an.remove(); });
      var w = el.querySelector('.intro__word'), t = w.textContent; w.textContent = '';
      t.split('').forEach(function (c, i) { var s = document.createElement('span'); s.textContent = c === ' ' ? '\u00a0' : c; s.style.setProperty('--i', i); w.appendChild(s); });
      var done = function () { if (!el.isConnected || el.classList.contains('is-out')) return; el.classList.add('is-out'); setTimeout(function () { el.remove(); }, 1000); };
      el.addEventListener('click', done);
      setTimeout(done, matchMedia('(prefers-reduced-motion: reduce)').matches ? 1200 : 3300);
    })();
  </script>
